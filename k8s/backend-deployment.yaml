apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-assessment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: devops-project-backend:latest # overwritten by CI/CD with a real tag; kind loads local image for manual testing
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # Liveness: is the Node process itself alive? If this fails
          # repeatedly, k8s kills and restarts the container.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Readiness: can this specific pod actually serve traffic right now
          # (DB reachable)? If this fails, k8s removes the pod from the
          # Service's endpoints -- traffic stops routing to it -- but does
          # NOT restart the container. Gives the DB time to recover without
          # unnecessary restarts.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3